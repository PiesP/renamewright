[package]
name = "renamewright-platform"
description = "Native platform boundary for Renamewright"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
renamewright-core = { path = "../renamewright-core" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
renamewright-windows-native = { path = "../renamewright-windows-native" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
