name: Windows Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "1.51.0"
  SYFT_WINDOWS_AMD64_SHA256: "fc5ffaeffb993576ece9c791da5a688fb2c8969a1479bbfe58583672c64da336"

jobs:
  package:
    name: acceptance/windows-portable
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy

      - name: Validate the complete Rust workspace
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Build isolated production and automation executables
        shell: pwsh
        run: |
          $inputRoot = Join-Path $PWD.Path 'target/native-app-input'
          $defaultRoot = Join-Path $inputRoot 'default'
          $automationRoot = Join-Path $inputRoot 'automation'
          New-Item -ItemType Directory -Path $defaultRoot, $automationRoot | Out-Null
          cargo build --package renamewright-app --release --bin renamewright --locked
          if ($LASTEXITCODE -ne 0) { throw 'The production build failed.' }
          Copy-Item 'target/release/renamewright.exe' (Join-Path $defaultRoot 'renamewright.exe')
          cargo build --package renamewright-app --release --bins --features automation --locked
          if ($LASTEXITCODE -ne 0) { throw 'The automation build failed.' }
          Copy-Item 'target/release/renamewright.exe' (Join-Path $automationRoot 'renamewright.exe')
          Copy-Item 'target/release/inspection-probe.exe' (Join-Path $automationRoot 'inspection-probe.exe')

      - name: Install the verified Syft binary
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'syft.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'syft'
          Invoke-WebRequest `
            -Uri "https://github.com/anchore/syft/releases/download/v${env:SYFT_VERSION}/syft_${env:SYFT_VERSION}_windows_amd64.zip" `
            -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:SYFT_WINDOWS_AMD64_SHA256) { throw 'Syft digest mismatch.' }
          Expand-Archive $archive $destination
          "SYFT_PATH=$(Join-Path $destination 'syft.exe')" | Add-Content $env:GITHUB_ENV

      - name: Prepare the source-bound acceptance artifact
        shell: pwsh
        run: >-
          ./scripts/prepare-windows-native-app.ps1
          -RepositoryRoot $PWD.Path
          -DefaultExecutablePath 'target/native-app-input/default/renamewright.exe'
          -AutomationExecutablePath 'target/native-app-input/automation/renamewright.exe'
          -InspectionProbePath 'target/native-app-input/automation/inspection-probe.exe'
          -OutputDirectory 'acceptance'
          -SourceSha $env:GITHUB_SHA
          -SyftPath $env:SYFT_PATH

      - name: Run the hosted runtime and automation budget gate
        shell: pwsh
        run: >-
          ./scripts/test-windows-native-app-runtime.ps1
          -DefaultExecutablePath 'target/native-app-input/default/renamewright.exe'
          -AutomationExecutablePath 'target/native-app-input/automation/renamewright.exe'
          -InspectionProbePath 'target/native-app-input/automation/inspection-probe.exe'
          -ArtifactDirectory 'acceptance'
          -SourceSha $env:GITHUB_SHA
          -AllowHostedRendererUnavailable

      - name: Upload the Windows acceptance artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renamewright-windows-acceptance-${{ github.sha }}
          path: acceptance/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record the immutable artifact identity
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          @"
          ## Windows acceptance artifact

          - Source SHA: ``${env:GITHUB_SHA}``
          - GitHub artifact digest: ``${env:ARTIFACT_DIGEST}``
          - Runtime: native Rust, portable executable
          - Signing: unsigned acceptance build
          - Interactive GUI matrix: not run by this hosted workflow
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
