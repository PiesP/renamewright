name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"

jobs:
  quality:
    name: pr-gate/quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: package.json
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Check frontend and Rust sources
        run: |
          pnpm fmt
          pnpm lint
          pnpm check
          pnpm fmt:rust
          cargo clippy \
            --package renamewright-core \
            --package renamewright-platform \
            --package renamewright-windows-native \
            --all-targets \
            --locked \
            -- -D warnings

  unit:
    name: pr-gate/unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: package.json
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run deterministic unit suites
        run: |
          pnpm test:cov
          cargo test \
            --package renamewright-core \
            --package renamewright-platform \
            --all-targets \
            --locked

  e2e:
    name: pr-gate/e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: package.json
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Chromium and host libraries
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise the rendered workbench
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: pr-gate/windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: package.json
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy

      - name: Lint the Windows native boundary
        run: >-
          cargo clippy
          --package renamewright-platform
          --package renamewright-windows-native
          --all-targets
          --locked
          -- -D warnings

      - name: Test the complete Rust workspace
        run: cargo test --workspace --all-targets --locked

      - name: Build the Windows desktop application
        run: pnpm tauri build --no-bundle
