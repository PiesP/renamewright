[package]
name = "renamewright-application"
description = "GUI-independent application service for Renamewright"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
renamewright-core = { path = "../renamewright-core" }
renamewright-platform = { path = "../renamewright-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[lints]
workspace = true
