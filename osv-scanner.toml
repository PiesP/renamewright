# OSV-Scanner's Cargo.lock view includes every target selected by Cargo's
# resolver. The GTK3 entries below belong to Tauri's Linux backend and are not
# compiled by the required Windows build. Renamewright does not call glib APIs
# directly. Tauri/tao currently retain this upstream GTK3 graph, so these
# exceptions are narrow, time-bounded, and must be reassessed before expiry.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-11-09
reason = "Linux-only glib 0.18.5 is transitive through Tauri; no direct glib API use and no upstream-compatible fixed graph yet."

