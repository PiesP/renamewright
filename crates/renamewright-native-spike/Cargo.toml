[package]
name = "renamewright-native-spike"
description = "Isolated native Rust UI and automation feasibility spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "renamewright-native-spike"
path = "src/main.rs"

[[bin]]
name = "inspection-probe"
path = "src/bin/inspection_probe.rs"
required-features = ["automation"]

[features]
default = []
automation = ["dep:egui_inspection"]

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_inspection = { version = "0.35.0", optional = true, features = ["plugin"] }
rfd = "0.17.2"

[dev-dependencies]
egui_kittest = "0.35.0"
kittest = "0.4.0"

[lints]
workspace = true
