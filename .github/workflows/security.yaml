name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # google/osv-scanner-action image v2.5.0 (linux/amd64), resolved 2026-08-08.
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner-action@sha256:4cc9d6b5a6bb3a81c38c8d1610f6855512ddd1ba5af77083a856f171dbd0d463

jobs:
  cargo-policy:
    name: pr-gate/cargo-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the verified cargo-deny binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$CARGO_DENY_SHA256  $archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Enforce Cargo license and source policy
        run: cargo-deny check licenses sources bans

  osv:
    name: pr-gate/osv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the Rust dependency graph
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=sarif \
            --output-file=/results/osv-results.sarif \
            -r \
            .

      - name: Upload OSV results
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: pr-gate/semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # semgrep/semgrep:1.172.0, resolved 2026-08-05.
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Rust sources and repository policy
        run: |
          semgrep scan \
            --config=p/rust \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: Upload Semgrep results
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
