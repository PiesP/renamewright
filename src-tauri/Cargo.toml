[package]
name = "renamewright-app"
description = "Tauri application shell for Renamewright"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "renamewright_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
renamewright-core = { path = "../crates/renamewright-core" }
renamewright-platform = { path = "../crates/renamewright-platform" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
