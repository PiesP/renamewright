version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    reviewers: ["PiesP"]
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    allow:
      - dependency-type: "direct"
    groups:
      frontend:
        patterns: ["solid-js", "@tauri-apps/api"]
        update-types: ["minor", "patch"]
      build:
        patterns: ["vite", "vite-plugin-solid", "@tauri-apps/cli"]
        update-types: ["minor", "patch"]
      quality:
        patterns: ["typescript", "@biomejs/*", "vitest", "@vitest/*", "jsdom"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    reviewers: ["PiesP"]
    labels: ["dependencies", "rust", "automated"]
    commit-message:
      prefix: "chore(deps-rust)"
    groups:
      tauri:
        patterns: ["tauri", "tauri-build"]
        update-types: ["minor", "patch"]
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    reviewers: ["PiesP"]
    labels: ["dependencies", "rust", "automated"]
    commit-message:
      prefix: "chore(toolchain)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    reviewers: ["PiesP"]
    labels: ["ci", "dependencies", "automated"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
