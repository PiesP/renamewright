[package]
name = "renamewright-app"
description = "Native Rust desktop application for Renamewright"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "renamewright"
path = "src/main.rs"

[[bin]]
name = "inspection-probe"
path = "src/bin/inspection_probe.rs"
required-features = ["automation"]

[features]
default = []
automation = ["dep:egui_inspection", "dep:pico-args", "dep:serde_json"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "glow", "persistence", "wayland", "x11"] }
egui_inspection = { version = "0.36.1", optional = true, features = ["plugin"] }
epaint_default_fonts = "0.36.1"
pico-args = { version = "0.5.0", optional = true }
renamewright-application = { path = "../renamewright-application" }
renamewright-platform = { path = "../renamewright-platform" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }

[target.'cfg(windows)'.dependencies]
renamewright-windows-native = { path = "../renamewright-windows-native" }

[dev-dependencies]
egui_kittest = "0.36.1"
kittest = "0.4.0"
skrifa = "0.44.0"
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3.0.11"

[lints]
workspace = true
