[workspace]
members = [
  "crates/renamewright-application",
  "crates/renamewright-core",
  "crates/renamewright-app",
  "crates/renamewright-platform",
  "crates/renamewright-windows-native",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["PiesP"]
license = "MIT"
repository = "https://github.com/PiesP/renamewright"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.release.package.renamewright-app]
opt-level = 3

[profile.release.package.renamewright-application]
opt-level = 3

[profile.release.package.renamewright-core]
opt-level = 3

[profile.release.package.renamewright-platform]
opt-level = 3
