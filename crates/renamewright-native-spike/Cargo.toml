[package]
name = "renamewright-native-spike"
description = "Isolated native Rust UI and automation feasibility spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "renamewright-native-spike"
path = "src/main.rs"

[[bin]]
name = "inspection-probe"
path = "src/bin/inspection_probe.rs"
required-features = ["automation"]

[features]
default = []
automation = ["dep:egui_inspection", "dep:pico-args", "dep:serde", "dep:serde_json"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
egui_inspection = { version = "0.35.0", optional = true, features = ["plugin"] }
pico-args = { version = "0.5.0", optional = true }
renamewright-application = { path = "../renamewright-application" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }

[target.'cfg(windows)'.dependencies]
renamewright-windows-native = { path = "../renamewright-windows-native" }

[dev-dependencies]
egui_kittest = "0.35.0"
kittest = "0.4.0"
tempfile = "3.27.0"

[lints]
workspace = true
